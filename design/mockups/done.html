<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VetFlow · Approved</title>
<style>
:root {
  --brand: #145c4a;
  --brand-press: #0d4739;
  --brand-tint: #e9f3ee;
  --ink: #14231e;
  --ink-2: #4a5d56;
  --ink-3: #5e6f69;
  --line: #e3e9e6;
  --surface: #ffffff;
  --canvas: #f6f8f7;
  --rec: #c2410c;
  --rec-tint: #fdf1eb;
  --warn: #955b06;
  --warn-tint: #fbf5e8;
  --ok: #15803d;
  --scrim: rgb(20 35 30 / .40);
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --dur-press: 120ms;
  --font: -apple-system, "SF Pro Text", BlinkMacSystemFont, Roboto, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: 15px; line-height: 22px; font-weight: 400;
  color: var(--ink);
  background: #dfe5e2;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  caret-color: var(--brand);
}
::selection { background: var(--brand-tint); color: var(--ink); }
button, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.lg { width: 24px; height: 24px; }
svg.i.sm { width: 16px; height: 16px; }

/* ---------- device frame ---------- */
.stack { display: flex; flex-direction: column; align-items: center; gap: 32px; padding: 0 0 32px; }
.phone {
  position: relative; width: 375px; height: 812px; overflow: hidden;
  background: var(--canvas); display: flex; flex-direction: column;
}
.phone[hidden] { display: none; }
.statusbar {
  height: 47px; flex: none; display: flex; align-items: flex-end; justify-content: space-between;
  padding: 0 26px 8px 32px; font-size: 15px; line-height: 20px; font-weight: 600; letter-spacing: -.01em;
}
.statusbar .sys { display: flex; gap: 6px; align-items: center; }
.statusbar .sys svg { height: 12px; width: auto; fill: var(--ink); stroke: none; }
.homebar { position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: var(--ink); transform: translateX(-50%); z-index: 30; }

/* ---------- top bar ---------- */
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; }
.topbar h1 { font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -.01em; flex: 1; }
.topbar.sub { padding-left: 4px; }
.topbar .ttl { flex: 1; min-width: 0; }
.icon-btn {
  width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 22px; color: var(--ink);
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press) ease;
}
.icon-btn:active { transform: scale(.97); background: var(--line); }
.avatar { width: 32px; height: 32px; border-radius: 16px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .02em; }

/* ---------- content ---------- */
.content { flex: 1; overflow: hidden; position: relative; }
.pad { padding: 0 16px; }
.summary { font-size: 13px; line-height: 18px; color: var(--ink-2); padding: 0 16px; margin-top: -4px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 28px 16px 8px; }
.sec-h h2 { font-size: 16px; line-height: 22px; font-weight: 600; }
.sec-h .meta { font-size: 13px; line-height: 18px; color: var(--ink-3); }
.link { color: var(--brand); font-weight: 600; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; padding: 0 4px; margin: -11px -4px; }

/* ---------- list ---------- */
.list { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); list-style: none; }
.row {
  position: relative; display: flex; align-items: center; gap: 16px; width: 100%; text-align: left;
  min-height: 64px; padding: 10px 16px; color: inherit; text-decoration: none;
  transition: background-color var(--dur-press) ease;
}
.row:active { background: var(--canvas); }
.row.s { min-height: 56px; padding-top: 8px; padding-bottom: 8px; }
.list > li + li > .row::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: 1px; background: var(--line); }
.list.t > li + li > .row::before { left: 16px; }
.lead { width: 40px; height: 40px; border-radius: 20px; background: var(--canvas); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.body { flex: 1; min-width: 0; }
.body > * { display: block; }
.t1 { font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t2 { font-size: 13px; line-height: 18px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trail { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-3); flex: none; text-align: right; }
.chev { color: var(--ink-3); }

/* ---------- status ---------- */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-2); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 4px; background: var(--ink-3); }
.status.ok { color: var(--ok); } .status.ok::before { background: var(--ok); }
.status.warn { color: var(--warn); } .status.warn::before { background: var(--warn); }
.status.rec { color: var(--rec); } .status.rec::before { background: var(--rec); }
.status.brand { color: var(--brand); } .status.brand::before { background: var(--brand); }

/* ---------- buttons ---------- */
.btn {
  min-height: 44px; padding: 0 16px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 15px; line-height: 22px; font-weight: 600; white-space: nowrap;
  transition: transform var(--dur-press) var(--ease-out), background-color var(--dur-press) ease;
}
.btn:active { transform: scale(.97); }
.btn.lg { min-height: 48px; border-radius: 10px; }
.btn.primary { background: var(--brand); color: #fff; }
.btn.primary:active { background: var(--brand-press); }
.btn.secondary { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost { color: var(--brand); }
.btn.danger { color: var(--rec); }
.btn.block { width: 100%; }
.icon-btn.outline { box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); color: var(--brand); }
.actionbar { flex: none; display: flex; gap: 12px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); }
.actionbar .btn { flex: 1; }
.actionbar.flow { padding-bottom: 34px; }

/* ---------- chips ---------- */
.chips { display: flex; gap: 8px; overflow: hidden; padding: 0 16px; }
.fchip { min-height: 44px; display: inline-flex; align-items: center; flex: none; }
.fchip span {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 16px;
  font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink-2); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line);
  transition: background-color var(--dur-press) ease;
}
.fchip span b { font-weight: 500; color: var(--ink-3); }
.fchip[aria-pressed="true"] span { background: var(--ink); color: #fff; box-shadow: none; }
.fchip[aria-pressed="true"] span b { color: #c9d3cf; }

/* ---------- allergy ---------- */
.allergy { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 10px; border-radius: 8px; background: var(--warn-tint); color: var(--warn); font-size: 13px; line-height: 18px; font-weight: 600; }

/* ---------- tab bar ---------- */
.tabbar { flex: none; height: 84px; padding: 0 4px 20px; display: flex; align-items: stretch; background: var(--surface); border-top: 1px solid var(--line); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink-3); font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none; min-height: 64px; }
.tab .pill { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color 200ms var(--ease-out); }
.tab[aria-current="page"] { color: var(--brand); font-weight: 600; }
.tab[aria-current="page"] .pill { background: var(--brand-tint); }
.tab.rec .disc { width: 52px; height: 52px; border-radius: 26px; background: var(--brand); color: #fff; display: grid; place-items: center; transition: transform var(--dur-press) var(--ease-out); }
.tab.rec:active .disc { transform: scale(.97); }
.tab.rec { gap: 0; }
.tab.rec .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---------- patient strip (consult) ---------- */
.strip { display: flex; align-items: center; gap: 12px; padding: 0 16px 12px; }
.strip .lead { width: 36px; height: 36px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.step { font-size: 13px; line-height: 18px; color: var(--ink-3); font-weight: 500; padding-right: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation: none !important; }
}

.top { padding: 24px 16px 0; }
.mark { width: 48px; height: 48px; border-radius: 24px; background: var(--brand-tint); color: var(--brand); display: grid; place-items: center; }
.mark svg { width: 24px; height: 24px; stroke-width: 2; }
.top h1 { font-size: 22px; line-height: 28px; font-weight: 650; letter-spacing: -.01em; margin-top: 16px; }
.top p { font-size: 13px; line-height: 18px; color: var(--ink-2); margin-top: 4px; }
.settle { display: block; width: 343px; height: 32px; margin: 20px 16px 0; overflow: visible; }
.settle path { vector-effect: non-scaling-stroke; fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.settle .amp { transform-box: view-box; transform-origin: 50% 50%; transform: scaleY(.02); animation: settle 700ms var(--ease-out) both; }
@keyframes settle { from { transform: scaleY(.45); } to { transform: scaleY(.02); } }
.meds { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 16px; }
.meds li { list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; font-size: 15px; line-height: 22px; }
.meds li + li { border-top: 1px solid var(--line); }
.meds .d { font-size: 13px; line-height: 18px; color: var(--ink-2); text-align: right; flex: none; padding-top: 2px; }
.acts .lead { color: var(--brand); background: var(--brand-tint); }

</style>
</head>
